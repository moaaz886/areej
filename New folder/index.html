<style>
:root{
  --ink:#2b2340; --pink:#1f6fe0; --rose:#9cc4f5; --blush:#e6f0ff; --blush2:#d3e4fb;
  --cream:#f6e3bd; --paper:#fffaf3; --red:#0b3a8c; --yellow:#fff1a8;
  --hand:"Dancing Script","Aref Ruqaa",cursive;
  --display:"Lilita One","Lalezar",system-ui,sans-serif;
  --body:"Baloo Bhaijaan 2",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--body);color:var(--ink);background:var(--blush);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.hidden{display:none!important}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:999}

.scene{position:fixed;inset:0;opacity:0;visibility:hidden;transition:opacity .9s ease,visibility .9s;overflow:hidden}
.scene.active{opacity:1;visibility:visible}

.pill-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 22px;border-radius:999px;background:var(--pink);color:#fff;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);font-weight:800;font-size:17px;transition:transform .15s,box-shadow .15s}
.pill-btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.pill-btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.pill-btn.light{background:#fff;color:var(--ink)}

.music{position:fixed;top:14px;right:14px;z-index:900;width:46px;height:46px;border-radius:50%;background:#fff;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);font-size:20px;display:grid;place-items:center}
.music.playing{animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------------- GATE ---------------- */
#gate{background:radial-gradient(circle at 30% 20%,#cfe2ff,transparent 50%),radial-gradient(circle at 80% 90%,#a9c9f5,transparent 45%),var(--blush);display:grid;place-items:center;padding:16px}
.floaters{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.floater{position:absolute;bottom:-40px;font-size:22px;opacity:.75;animation:floatUp linear infinite}
@keyframes floatUp{to{transform:translateY(-115vh) rotate(25deg)}}
.gate-card{position:relative;width:min(400px,100%);background:#fff;border:3px solid var(--ink);border-radius:28px;box-shadow:8px 8px 0 var(--pink);padding:30px 24px 26px;text-align:center}
.gate-card h1{font-family:var(--body);font-weight:800;font-size:22px;margin:12px 0 4px}
.gate-card p{opacity:.75;font-size:15px}
.lock{width:70px;height:80px;margin:0 auto}
.lock .shackle{transform-origin:62px 34px;transition:transform .6s cubic-bezier(.5,1.8,.5,1)}
.lock.unlocked .shackle{transform:translateY(-8px) rotate(28deg)}
.gate-form{margin-top:18px;display:flex;flex-direction:column;gap:12px;align-items:center}
.gate-form input{width:100%;padding:13px 16px;border:3px solid var(--ink);border-radius:16px;font:inherit;font-size:18px;text-align:center;outline:none;background:var(--blush)}
.gate-form input:focus{box-shadow:0 0 0 4px #1f6fe044}
.gate-msg{min-height:22px;font-size:14px;color:var(--pink);font-weight:600}
.hint-btn{font-size:14px;text-decoration:underline;opacity:.7}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.cd-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}
.cd-box{border:3px solid var(--ink);border-radius:14px;padding:8px 2px;background:var(--blush)}
.cd-box b{display:block;font-family:var(--display);font-size:28px;line-height:1.1;color:var(--pink)}
.cd-box span{font-size:12px;opacity:.75}

/* ---------------- INTRO ---------------- */
#intro{background:#8dbbf5;transition:opacity .9s,visibility .9s,background 1.4s}
#intro.whiteout{background:var(--blush)}
.bubble{position:absolute;border-radius:50%;background:#ffffff22}
.balloon{position:absolute;bottom:-90px;border-radius:50% 50% 48% 52%/55% 55% 45% 45%;animation:rise linear infinite;opacity:.9}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:60px;background:#ffffff99}
@keyframes rise{to{transform:translateY(-125vh) translateX(30px)}}
.intro-wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px;text-align:center}
.cake{width:min(260px,62vw);overflow:visible}
.cake .part{opacity:0}
#intro.play .plate{animation:fadeIn .5s .2s forwards}
#intro.play .tier1{animation:drop .9s .4s cubic-bezier(.3,1.4,.5,1) forwards}
#intro.play .tier2{animation:drop .9s 1s cubic-bezier(.3,1.4,.5,1) forwards}
#intro.play .icing{animation:pour .7s forwards}
#intro.play .icing1{animation-delay:1.5s}
#intro.play .icing2{animation-delay:1.8s}
#intro.play .candle{animation:candleUp .5s forwards}
#intro.play .flame{animation:fadeIn .4s forwards,flicker .18s 3.2s infinite alternate}
@keyframes fadeIn{to{opacity:1}}
@keyframes drop{from{opacity:0;transform:translateY(-260px)}to{opacity:1;transform:none}}
@keyframes pour{from{opacity:1;transform:scaleY(0)}to{opacity:1;transform:scaleY(1)}}
@keyframes candleUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes flicker{from{transform:scale(1,1) skewX(-3deg)}to{transform:scale(.92,1.08) skewX(3deg)}}
.cake .icing{transform-box:fill-box;transform-origin:top}
.cake .flame{transform-box:fill-box;transform-origin:50% 100%;cursor:pointer}
.cake .candle-hit{cursor:pointer}
.cake .flame.out{animation:none!important;opacity:0!important;transition:opacity .3s,transform .3s;transform:scale(.2)}
.smoke{position:absolute;width:10px;height:10px;border-radius:50%;background:#ffffffaa;pointer-events:none;animation:smoke 1.4s ease-out forwards}
@keyframes smoke{to{transform:translate(var(--dx),-80px) scale(3);opacity:0}}
.intro-title{font-family:var(--hand);font-weight:700;font-size:clamp(34px,7vw,60px);color:#0b3a8c;opacity:0;transform:translateY(16px);transition:all .8s}
.intro-name{font-family:var(--hand);font-size:clamp(28px,5.5vw,46px);color:#fff;text-shadow:0 2px 0 #0b3a8c;opacity:0;transform:translateY(16px);transition:all .8s .25s}
.intro-hint{margin-top:10px;font-size:16px;color:#fff;font-weight:600;opacity:0;transition:opacity .8s .6s;max-width:420px}
.mic-btn{margin-top:6px;color:#fff;font-size:14px;border:2px dashed #ffffffaa;border-radius:999px;padding:6px 14px;opacity:0;transition:opacity .8s .9s}
#intro.ready .intro-title,#intro.ready .intro-name{opacity:1;transform:none}
#intro.ready .intro-hint,#intro.ready .mic-btn{opacity:1}
#intro.done .intro-hint,#intro.done .mic-btn{opacity:0;pointer-events:none}

.cake .part{transform-box:fill-box;transform-origin:center}
#intro.play .belt{animation:drop .9s .4s cubic-bezier(.3,1.4,.5,1) forwards}
#intro.play .tail{animation:drop .7s 1.2s cubic-bezier(.3,1.4,.5,1) forwards}
#intro.play .knot{animation:popK .6s 1.6s cubic-bezier(.3,1.7,.5,1) forwards}
#intro.play .star{animation:popK .5s 2.3s cubic-bezier(.3,1.7,.5,1) forwards}
@keyframes popK{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:none}}
#intro.ready .cake{cursor:pointer;animation:beltPulse 1.4s ease-in-out infinite}
#intro.done .cake{animation:none}
@keyframes beltPulse{50%{transform:scale(1.06) rotate(-2deg)}}

/* ---------------- MAIN ---------------- */
#main{background-color:var(--blush);background-image:linear-gradient(#b9d2f555 1px,transparent 1px),linear-gradient(90deg,#b9d2f555 1px,transparent 1px);background-size:34px 34px;overflow-y:auto;overflow-x:hidden}
.bunting{position:absolute;top:0;width:min(300px,45vw);height:auto;pointer-events:none}
.bunting.left{left:0}.bunting.right{right:0;transform:scaleX(-1)}
.sparkle{position:absolute;width:16px;height:16px;fill:var(--ink);animation:twinkle 2.4s ease-in-out infinite;pointer-events:none}
@keyframes twinkle{50%{transform:scale(.4) rotate(45deg);opacity:.4}}
.main-wrap{position:relative;min-height:100%;max-width:1150px;margin:0 auto;padding:90px 24px 50px;display:flex;align-items:center;justify-content:space-between;gap:30px}
.main-left{flex:1 1 520px;position:relative}
.main-right{flex:0 1 380px;position:relative;display:flex;justify-content:center;padding-top:40px}
.hb{font-family:var(--display);line-height:.92;font-size:clamp(54px,11vw,132px);letter-spacing:1px;position:relative;display:inline-block}
.hb .row{display:block;white-space:nowrap}
.hb .ch{display:inline-block;opacity:0;transform:scale(.3) translateY(30px);paint-order:stroke fill;-webkit-text-stroke:.07em var(--ink)}
.hb .r1 .ch{color:#fff;text-shadow:.06em .06em 0 var(--rose)}
.hb .r2 .ch{color:var(--pink);text-shadow:.06em .06em 0 var(--ink)}
#main.play .hb .ch{animation:popIn .5s cubic-bezier(.3,1.7,.5,1) forwards;animation-delay:calc(var(--i) * 90ms + .3s)}
@keyframes popIn{to{opacity:1;transform:none}}
.hat{position:absolute;width:.95em;top:-.42em;left:calc(var(--hatx,4.6) * 1em);transform:rotate(22deg) scale(0);transform-origin:bottom center;opacity:0}
#main.play .hat{animation:hatIn .6s 1.8s cubic-bezier(.3,1.7,.5,1) forwards}
@keyframes hatIn{to{opacity:1;transform:rotate(22deg) scale(1)}}
.name-pill{margin-top:22px;display:inline-flex;align-items:center;justify-content:space-between;gap:14px;min-width:min(330px,100%);padding:8px 16px;border-radius:999px;background:var(--pink);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);color:#fff;font-family:var(--hand);font-size:30px;font-weight:700}
.name-pill svg{width:20px;height:20px;fill:#ffd36b;stroke:var(--ink);stroke-width:1.5}
.fade-up{opacity:0;transform:translateY(20px)}
#main.play .fade-up{animation:fadeUp .7s forwards;animation-delay:var(--d,2s)}
@keyframes fadeUp{to{opacity:1;transform:none}}
.btn-row{margin-top:20px;display:flex;flex-wrap:wrap;gap:12px}
.timer-card{margin-top:24px;display:inline-block;background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:5px 5px 0 var(--rose);padding:12px 16px}
.timer-card h3{font-size:15px;font-weight:800;margin-bottom:6px}
.timer-row{display:flex;gap:8px}
.t-box{min-width:62px;text-align:center;background:var(--blush);border:2px solid var(--ink);border-radius:12px;padding:4px 6px}
.t-box b{display:block;font-family:var(--display);font-size:24px;color:var(--pink);line-height:1.15}
.t-box span{font-size:11px;opacity:.75}
.photo-wrap{position:relative;width:min(300px,70vw);aspect-ratio:1}
.photo{width:100%;height:100%;border-radius:50%;object-fit:cover;border:5px solid var(--ink);box-shadow:9px 9px 0 var(--pink);background:#fff;opacity:0;transform:scale(.6) rotate(-8deg)}
#main.play .photo{animation:photoIn .9s 1.2s cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes photoIn{to{opacity:1;transform:none}}
.photo-tag{position:absolute;bottom:-6px;right:4%;background:var(--pink);color:#fff;border:3px solid var(--ink);border-radius:12px;padding:3px 12px;font-family:var(--hand);font-size:20px;transform:rotate(-6deg);white-space:nowrap}
.balloon-main{position:absolute;width:74px;top:-74px;left:-22px;animation:sway 3.5s ease-in-out infinite;transform-origin:50% 100%;cursor:pointer;z-index:2}
.balloon-main.popped{animation:none;opacity:0;transform:scale(1.6);transition:all .2s}
@keyframes sway{50%{transform:rotate(7deg) translateY(-8px)}}
.smiley{position:absolute;width:62px;left:-70px;bottom:24px;animation:wobble 3s ease-in-out infinite;cursor:pointer}
@keyframes wobble{50%{transform:rotate(-14deg)}}
.env-mini{position:absolute;right:-24px;bottom:-60px;width:62px;cursor:pointer;animation:bounce 1.6s ease-in-out infinite;filter:drop-shadow(3px 3px 0 var(--ink))}
@keyframes bounce{50%{transform:translateY(-10px) rotate(-6deg)}}
.sticky{position:absolute;z-index:5;width:250px;right:-10px;top:40%;background:var(--yellow);padding:28px 18px 18px;box-shadow:4px 6px 14px #0002;font-family:var(--hand);font-size:22px;line-height:1.5;transform:rotate(3deg) scale(0);transform-origin:80% 0;transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
.sticky.show{transform:rotate(3deg) scale(1)}
.sticky::before{content:"";position:absolute;top:-12px;left:50%;width:90px;height:24px;margin-left:-45px;background:#9cc4f5cc;transform:rotate(-4deg)}
.sticky .x{position:absolute;top:4px;left:8px;font-family:var(--body);font-size:18px;opacity:.6}
.sticky small{display:block;margin-top:8px;font-size:18px;text-align:left;opacity:.8}

@media (max-width:860px){
  .main-wrap{flex-direction:column;justify-content:flex-start;text-align:center;padding-top:70px;gap:10px}
  .main-left{flex:none;display:flex;flex-direction:column;align-items:center}
  .main-right{order:-1;flex:none;padding-top:70px;margin-bottom:46px}
  .btn-row{justify-content:center}
  .smiley{left:-44px;width:48px;bottom:0}
  .env-mini{right:-14px;bottom:-30px;width:52px}
  .sticky{right:50%;margin-right:-125px;top:55%}
  .balloon-main{width:60px;top:-60px;left:-6px}
}

/* ---------------- MODALS ---------------- */
.modal{position:fixed;inset:0;z-index:600;background:#2b234088;backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);display:grid;place-items:center;opacity:0;visibility:hidden;transition:opacity .5s,visibility .5s;padding:16px}
.modal.active{opacity:1;visibility:visible}
.close-btn{position:absolute;top:16px;left:16px;z-index:5;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:6px 16px;font-weight:800;box-shadow:3px 3px 0 var(--ink)}

/* card */
.card3d{--w:min(310px,82vw);width:var(--w);height:calc(var(--w) * 1.42);position:relative;perspective:1800px;transition:transform 1.1s cubic-bezier(.6,0,.3,1);transform:scale(.8);cursor:pointer}
.modal.active .card3d{transform:scale(1)}
.card3d.open{transform:translateX(50%)}
.cover{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;transition:transform 1.2s cubic-bezier(.6,0,.3,1),opacity .4s;z-index:2}
.card3d.open .cover{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:6px 14px 14px 6px;overflow:hidden}
.front{background:linear-gradient(160deg,#fff 0%,#e4efff 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:20px;text-align:center;box-shadow:0 20px 50px #0005}
.front .dear{font-family:var(--hand);font-size:22px;color:#3a4f7a}
.front .neon{font-family:var(--hand);font-weight:700;font-size:clamp(40px,12vw,56px);line-height:1;color:#1f6fe0;text-shadow:0 0 8px #6fa8f5,0 0 22px #6fa8f599}
.front .sub{font-size:13px;opacity:.7}
.front img{width:74px;height:74px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 0 0 3px #1f6fe055;margin-top:8px}
.front .tap{margin-top:8px;font-size:12px;opacity:.55;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.15}}
.back{transform:rotateY(180deg);background:#dbe9ff;background-image:radial-gradient(#9cc4f5 1.5px,transparent 1.5px);background-size:18px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;border-radius:14px 6px 6px 14px}
.back img{width:58%;aspect-ratio:1;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 8px 24px #1f6fe055}
.back p{font-family:var(--hand);font-size:24px;color:var(--pink);text-align:center;padding:0 12px}
.inside{position:absolute;inset:0;border-radius:6px 14px 14px 6px;background:linear-gradient(170deg,#2f86f0,#0f4bb5);color:#fff;padding:22px 20px 18px;display:flex;flex-direction:column;box-shadow:0 20px 50px #0005}
.inside::before{content:"🥋";position:absolute;top:-14px;left:-12px;font-size:34px}
.inside h2{font-family:var(--hand);font-size:34px;text-align:center;padding-bottom:8px;border-bottom:2px dashed #ffffff88;margin-bottom:10px}
.inside .msg{flex:1;overflow-y:auto;font-family:var(--hand);font-size:19px;line-height:1.65;white-space:pre-line;padding:0 4px;scrollbar-width:thin}
.inside .sig{margin-top:10px;font-family:var(--hand);font-size:22px;text-align:end}
@media (max-width:700px){
  .card3d.open{transform:none}
  .card3d.open .cover{opacity:0;transition:transform 1.2s cubic-bezier(.6,0,.3,1),opacity .4s .7s}
  .card3d.open .cover{pointer-events:none}
}

/* memories */
.polaroid-stage{position:relative;width:min(320px,80vw);height:calc(min(320px,80vw) * 1.22)}
.polaroid{position:absolute;inset:0;background:#fff;padding:14px 14px 0;box-shadow:0 18px 40px #0004;border-radius:4px;transition:transform .6s cubic-bezier(.4,1.3,.5,1),opacity .5s;display:flex;flex-direction:column}
.polaroid img{width:100%;aspect-ratio:1;object-fit:cover;background:#eee}
.polaroid p{flex:1;display:grid;place-items:center;font-family:var(--hand);font-size:24px;text-align:center;padding:4px}
.mem-nav{display:flex;gap:14px;justify-content:center;margin-top:22px;align-items:center;color:#fff;font-weight:800}
.mem-wrap{display:flex;flex-direction:column;align-items:center}

/* ---------------- LETTERS ---------------- */
#letters{background:radial-gradient(circle at 50% 45%,#2f86f0,#0f4bb5 70%,#0a3585)}
.big-heart{position:absolute;color:#ff3b4f;filter:blur(3px);opacity:.55;pointer-events:none;animation:beat 2.2s ease-in-out infinite}
.mini-heart{position:absolute;bottom:-20px;color:#ffc2cf;font-size:14px;pointer-events:none;animation:floatUp linear infinite}
.draw{position:absolute;left:50%;top:50%;width:min(240px,60vw);transform:translate(-50%,-50%);overflow:visible;pointer-events:none}
.draw .ln{fill:none;stroke:#ffe5e9;stroke-width:1.6;stroke-dasharray:1;stroke-dashoffset:1}
.draw .hfill{fill:#ff2a40;opacity:0;transform-box:fill-box;transform-origin:center;filter:drop-shadow(0 0 18px #ff8090)}
#letters.play .draw .l1{animation:dash 1.1s .2s ease forwards}
#letters.play .draw .l2{animation:dash 1s 1s ease forwards}
#letters.play .draw .l3{animation:dash 1s 1.3s ease forwards}
#letters.play .draw .lines{animation:fadeOut .6s 2.5s forwards}
#letters.play .draw .hfill{animation:heartIn .7s 2.3s forwards,beat .5s 3s 2}
#letters.play .draw{animation:drawAway .7s 4.1s forwards}
@keyframes dash{to{stroke-dashoffset:0}}
@keyframes fadeOut{to{opacity:0}}
@keyframes heartIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.12)}}
@keyframes drawAway{to{opacity:0;transform:translate(-50%,-50%) scale(.3)}}
.envelope{--ew:min(420px,84vw);position:absolute;left:50%;top:50%;width:var(--ew);height:calc(var(--ew) * .64);transform:translate(-50%,-40%) scale(.4);opacity:0;transition:transform .9s cubic-bezier(.3,1.5,.5,1),opacity .6s;perspective:1200px}
.envelope.show{opacity:1;transform:translate(-50%,-40%) scale(1)}
.env-back{position:absolute;inset:0;background:#ecd3a4;border-radius:6px;box-shadow:0 20px 40px #0004}
.env-paper{position:absolute;left:7%;right:7%;top:8%;height:80%;background:var(--paper);border-radius:4px;transition:transform .8s .5s cubic-bezier(.4,1.4,.5,1);display:grid;place-items:start center;padding-top:8%;color:var(--red)}
.env-front{position:absolute;inset:0;background:linear-gradient(180deg,#f6e3bd,#f1d9ab);clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%);border-radius:6px;z-index:3}
.env-front::before,.env-front::after{content:"";position:absolute;bottom:0;width:60%;height:100%;background:linear-gradient(0deg,#00000010,transparent)}
.env-front::before{left:0;clip-path:polygon(0 100%,0 0,85% 100%)}
.env-front::after{right:0;clip-path:polygon(100% 100%,100% 0,15% 100%)}
.env-flap{position:absolute;left:0;right:0;top:0;height:60%;background:linear-gradient(180deg,#f3ddb2,#e9cf9c);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s ease,z-index 0s .4s;z-index:4}
.envelope.open .env-flap{transform:rotateX(180deg);z-index:1}
.envelope.open .env-paper{transform:translateY(-38%)}
.env-label{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;padding-top:8%;color:#7b5a3a;transition:opacity .4s;pointer-events:none}
.env-label b{font-family:var(--hand);font-size:clamp(22px,5vw,30px)}
.env-label span{font-family:var(--hand);font-size:clamp(18px,4vw,24px);opacity:.75}
.seal{position:absolute;left:50%;top:60%;transform:translate(-50%,-50%);z-index:6;width:76px;height:70px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;transition:opacity .3s,transform .3s}
.seal svg{position:absolute;inset:0;width:100%;height:100%;fill:#0b3a8c;filter:drop-shadow(0 4px 6px #0004)}
.seal span{position:relative;margin-top:-4px}
.seal:hover{transform:translate(-50%,-50%) scale(1.08)}
.envelope:not(.open) .seal{animation:sealPulse 1.4s infinite}
@keyframes sealPulse{50%{transform:translate(-50%,-50%) scale(1.1)}}
.envelope.open .env-label,.envelope.open .seal{opacity:0;pointer-events:none}
.ltr{position:absolute;left:50%;top:50%;width:min(340px,84vw);min-height:200px;background:var(--paper);border-radius:6px;box-shadow:0 14px 34px #0005;padding:26px 22px 20px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:12px;opacity:0;transition:transform .9s cubic-bezier(.45,1.2,.4,1),opacity .5s,box-shadow .3s;cursor:pointer;z-index:10;pointer-events:none}
.ltr.shown{pointer-events:auto}
.ltr::before{content:"· ♥ ·";position:absolute;top:8px;left:0;right:0;color:var(--red);font-size:16px;letter-spacing:4px}
.ltr p{font-family:var(--hand);font-size:22px;line-height:1.55;color:#3a2a2a}
.ltr small{font-family:var(--hand);font-size:18px;color:#7a5a5a}
.ltr.reading{z-index:50;cursor:default;box-shadow:0 24px 60px #0007}
.letter-ctrl{position:absolute;left:0;right:0;bottom:max(22px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:12px;align-items:center;z-index:60;opacity:0;pointer-events:none;transition:opacity .4s}
.letter-ctrl.show{opacity:1;pointer-events:auto}
.letter-ctrl .count{color:#fff;font-weight:800;min-width:46px;text-align:center}
.final-line{position:absolute;left:0;right:0;top:12%;text-align:center;font-family:var(--hand);font-size:clamp(46px,11vw,90px);color:#fff;text-shadow:0 0 20px #ff8a9a;z-index:55;opacity:0;transform:scale(.5);transition:all .8s cubic-bezier(.3,1.6,.5,1);pointer-events:none}
.final-line.show{opacity:1;transform:scale(1);animation:beat 1.6s 1s infinite}
.back-btn{position:absolute;top:16px;left:16px;z-index:70}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<audio id="bgm" loop preload="auto"></audio>
<button class="music hidden" id="musicBtn" aria-label="music">🎵</button>

<!-- ============ GATE ============ -->
<section class="scene active" id="gate">
  <div class="floaters" id="gateFloaters"></div>
  <div class="gate-card" id="gateCard">
    <svg class="lock" id="lockIcon" viewBox="0 0 80 90">
      <path class="shackle" d="M18 40 V26 a22 22 0 0 1 44 0 V40" fill="none" stroke="#2b2340" stroke-width="7" stroke-linecap="round"/>
      <rect x="8" y="38" width="64" height="48" rx="12" fill="#1f6fe0" stroke="#2b2340" stroke-width="4"/>
      <circle cx="40" cy="58" r="6" fill="#2b2340"/><rect x="37" y="60" width="6" height="14" rx="3" fill="#2b2340"/>
    </svg>
    <div id="countdownView" class="hidden">
      <h1 dir="auto" data-t="countdownTitle"></h1>
      <p dir="auto" data-t="countdownText"></p>
      <div class="cd-grid" dir="rtl" id="cdGrid"></div>
    </div>
    <div id="passView">
      <h1 dir="auto" data-t="gateTitle"></h1>
      <p dir="auto" id="gateText" data-t="gateText"></p>
      <form class="gate-form" id="pwForm" autocomplete="off">
        <input id="pwInput" type="password" dir="auto">
        <button class="pill-btn" type="submit" id="pwBtn" data-t="gateBtn"></button>
        <div class="gate-msg" id="gateMsg" dir="auto"></div>
        <button type="button" class="hint-btn" id="hintBtn" data-t="hintBtn"></button>
      </form>
    </div>
  </div>
</section>

<!-- ============ INTRO ============ -->
<section class="scene" id="intro">
  <div class="bubble" style="width:340px;height:340px;left:-120px;bottom:-170px"></div>
  <div class="bubble" style="width:260px;height:260px;right:-80px;bottom:-120px"></div>
  <div id="introBalloons"></div>
  <div class="intro-wrap">
    <svg class="cake" id="cake" viewBox="0 0 240 240">
      <g class="part tail"><path d="M104 132 L84 214 L110 206 L124 134Z" fill="#1558b8" stroke="#2b2340" stroke-width="3" stroke-linejoin="round"/><path d="M118 132 L126 210 L152 218 L140 132Z" fill="#1f6fe0" stroke="#2b2340" stroke-width="3" stroke-linejoin="round"/></g>
      <g class="part belt"><rect x="6" y="96" width="228" height="40" rx="6" fill="#1f6fe0" stroke="#2b2340" stroke-width="3"/><path d="M10 107H230M10 125H230" stroke="#9cc4f5" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/></g>
      <g class="part knot"><rect x="96" y="88" width="48" height="56" rx="12" fill="#1558b8" stroke="#2b2340" stroke-width="3"/><path d="M104 104H136M104 128H136" stroke="#9cc4f5" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/></g>
      <g transform="translate(92,18) scale(2.3)"><path class="part star" d="M12 2l3 6.5 7 .8-5.2 4.8 1.5 7-6.3-3.6L5.7 21l1.5-7L2 9.3l7-.8z" fill="#ffd36b" stroke="#2b2340" stroke-width="1.2" stroke-linejoin="round"/></g>
    </svg>
    <div class="intro-title" id="introTitle"></div>
    <div class="intro-name" id="introName"></div>
    <div class="intro-hint" dir="auto" data-t="introHint"></div>
  </div>
</section>

<!-- ============ MAIN ============ -->
<section class="scene" id="main">
  <svg class="bunting left" id="buntL" viewBox="0 0 300 120"></svg>
  <svg class="bunting right" id="buntR" viewBox="0 0 300 120"></svg>
  <div id="sparkles"></div>
  <div class="main-wrap">
    <div class="main-left">
      <h1 class="hb" id="hb"></h1>
      <div class="name-pill fade-up" style="--d:2s">
        <svg viewBox="0 0 24 24"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.5 7-6.3-3.6L5.7 21l1.5-7L2 9.3l7-.8z"/></svg>
        <span id="pillName"></span>
        <svg viewBox="0 0 24 24"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.5 7-6.3-3.6L5.7 21l1.5-7L2 9.3l7-.8z"/></svg>
      </div>
      <div class="btn-row fade-up" style="--d:2.3s">
        <button class="pill-btn" id="openCardBtn" dir="auto" data-t="cardBtn"></button>
        <button class="pill-btn light" id="openLettersBtn" dir="auto" data-t="lettersBtn"></button>
        <button class="pill-btn light" id="openMemBtn" dir="auto" data-t="memoriesBtn"></button>
      </div>
      <div class="timer-card fade-up" style="--d:2.6s" id="timerCard">
        <h3 dir="auto" data-t="togetherTitle"></h3>
        <div class="timer-row" dir="rtl" id="togetherRow"></div>
      </div>
    </div>
    <div class="main-right">
      <div class="photo-wrap">
        <svg class="balloon-main" id="balloonMain" viewBox="0 0 60 60"><path transform="translate(2,2) scale(2.3)" d="M12 2l3 6.5 7 .8-5.2 4.8 1.5 7-6.3-3.6L5.7 21l1.5-7L2 9.3l7-.8z" fill="#ffd36b" stroke="#2b2340" stroke-width="1.2" stroke-linejoin="round"/></svg>
        <img class="photo" id="mainPhoto" alt="">
        <div class="photo-tag fade-up" style="--d:2.1s" id="photoTag"></div>
        <svg class="smiley" id="smiley" viewBox="0 0 64 64">
          <circle cx="32" cy="32" r="28" fill="#fff" stroke="#2b2340" stroke-width="3"/>
          <ellipse class="eyeL" cx="23" cy="26" rx="3" ry="5" fill="#2b2340"/>
          <ellipse class="eyeR" cx="41" cy="26" rx="3" ry="5" fill="#2b2340"/>
          <path d="M19 38 q13 13 26 0" fill="none" stroke="#2b2340" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <svg class="env-mini" id="envMini" viewBox="0 0 64 48">
          <rect x="2" y="2" width="60" height="44" rx="4" fill="#1f6fe0" stroke="#2b2340" stroke-width="3"/>
          <path d="M3 4 L32 28 L61 4" fill="none" stroke="#2b2340" stroke-width="3" stroke-linejoin="round"/>
          <path d="M32 32 c-6-6-12 0-6 5 l6 5 6-5 c6-5 0-11-6-5z" fill="#fff"/>
        </svg>
        <div class="sticky" id="sticky" dir="auto">
          <button class="x" id="stickyX">✕</button>
          <span id="stickyText"></span>
          <small id="stickyFrom"></small>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- ============ LETTERS ============ -->
<section class="scene" id="letters">
  <div id="heartsBg"></div>
  <button class="pill-btn light back-btn" id="lettersBack" data-t="back"></button>
  <svg class="draw" viewBox="0 0 200 200">
    <g class="lines">
      <polygon class="ln l1" pathLength="1" points="100,53.4 156.6,110 100,166.6 43.4,110"/>
      <circle class="ln l2" pathLength="1" cx="71.7" cy="81.7" r="40"/>
      <circle class="ln l3" pathLength="1" cx="128.3" cy="81.7" r="40"/>
    </g>
    <path class="hfill" d="M100 166.6 L43.4 110 A40 40 0 0 1 100 53.4 A40 40 0 0 1 156.6 110 Z"/>
  </svg>
  <div class="envelope" id="envelope">
    <div class="env-back"></div>
    <div class="env-paper">♥</div>
    <div class="env-front"></div>
    <div class="env-flap"></div>
    <div class="env-label"><b data-t="envelopeTitle"></b><span data-t="envelopeTo"></span></div>
    <button class="seal" id="seal"><svg viewBox="0 0 24 22"><path d="M12 21.6 1.9 11.7A6 6 0 0 1 12 3.3a6 6 0 0 1 10.1 8.4z"/></svg><span data-t="openBtn"></span></button>
  </div>
  <div id="ltrLayer"></div>
  <div class="final-line" id="finalLine" dir="auto"></div>
  <div class="letter-ctrl" id="letterCtrl">
    <span class="count" id="ltrCount"></span>
    <button class="pill-btn light" id="nextLtr" dir="auto"></button>
  </div>
</section>

<!-- ============ CARD MODAL ============ -->
<div class="modal" id="cardModal">
  <button class="close-btn" data-close="cardModal" data-t="back"></button>
  <div class="card3d" id="card3d">
    <div class="inside">
      <h2 data-t-card="title"></h2>
      <div class="msg" dir="auto" id="cardMsg"></div>
      <div class="sig" dir="auto" id="cardSig"></div>
    </div>
    <div class="cover">
      <div class="face front">
        <div class="dear" id="cardDear"></div>
        <div class="neon">Congrats!<br>Blue Belt</div>
        <div class="sub" dir="auto" id="cardSub"></div>
        <img class="card-photo" alt="">
        <div class="tap" dir="auto" data-t="tapToOpen"></div>
      </div>
      <div class="face back">
        <img class="card-photo" alt="">
        <p id="cardBackText"></p>
      </div>
    </div>
  </div>
</div>

<!-- ============ MEMORIES MODAL ============ -->
<div class="modal" id="memModal">
  <button class="close-btn" data-close="memModal" data-t="back"></button>
  <div class="mem-wrap">
    <div class="polaroid-stage" id="polaroidStage"></div>
    <div class="mem-nav">
      <button class="pill-btn light" id="memPrev">‹</button>
      <span id="memCount"></span>
      <button class="pill-btn light" id="memNext">›</button>
    </div>
  </div>
</div>

<script>
(() => {
const C = CONFIG, U = C.ui;
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const fill = s => String(s ?? "").replace(/\{(\w+)\}/g, (m, k) => C[k] ?? m);
const rand = (a, b) => a + Math.random() * (b - a);
const wait = ms => new Promise(r => setTimeout(r, ms));
const NS = "http://www.w3.org/2000/svg";

/* ---------- placeholders ---------- */
function placeholder(label, hue = 215) {
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 400'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='hsl(${hue},90%,88%)'/><stop offset='1' stop-color='hsl(${hue + 20},80%,72%)'/></linearGradient></defs><rect width='400' height='400' fill='url(#g)'/><circle cx='200' cy='165' r='70' fill='#ffffffaa'/><path d='M80 400c10-90 60-130 120-130s110 40 120 130z' fill='#ffffffaa'/><text x='200' y='372' text-anchor='middle' font-family='sans-serif' font-size='22' fill='#2b2340' opacity='.6'>${label}</text></svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}
function setImg(img, src, label, hue) {
  img.onerror = () => { img.onerror = null; img.src = placeholder(label, hue); };
  img.src = src || placeholder(label, hue);
}

/* ---------- texts ---------- */
$$("[data-t]").forEach(el => el.textContent = fill(U[el.dataset.t]));
$$("[data-t-card]").forEach(el => el.textContent = fill(C.card[el.dataset.tCard]));
$("#pwInput").placeholder = fill(U.gatePlaceholder);
document.title = `Congrats ${C.name} 🥋`;

/* ---------- confetti ---------- */
const cv = $("#fx"), cx = cv.getContext("2d");
let parts = [], fxRunning = false;
const COLORS = ["#1f6fe0", "#6fa8f5", "#cfe2ff", "#ffffff", "#ffc94d", "#0b3a8c", "#ffd36b"];
function sizeCanvas() { const d = Math.min(devicePixelRatio || 1, 2); cv.width = innerWidth * d; cv.height = innerHeight * d; cx.setTransform(d, 0, 0, d, 0, 0); }
sizeCanvas(); addEventListener("resize", sizeCanvas);
function burst(x, y, n = 120, power = 11, spread = Math.PI * 2, dir = -Math.PI / 2) {
  for (let i = 0; i < n; i++) {
    const a = dir + rand(-spread / 2, spread / 2), v = rand(power * .35, power);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: rand(0, 6.28), vr: rand(-.3, .3), s: rand(5, 10), c: COLORS[i % COLORS.length], shape: Math.random() < .25 ? "heart" : Math.random() < .5 ? "rect" : "circle", life: 0, max: rand(140, 220) });
  }
  if (!fxRunning) { fxRunning = true; requestAnimationFrame(tick); }
}
function rain(ms = 2500) {
  const end = performance.now() + ms;
  (function drop() {
    for (let i = 0; i < 4; i++) parts.push({ x: rand(0, innerWidth), y: -10, vx: rand(-1, 1), vy: rand(2, 4), r: rand(0, 6), vr: rand(-.2, .2), s: rand(5, 9), c: COLORS[(Math.random() * COLORS.length) | 0], shape: Math.random() < .3 ? "heart" : "rect", life: 0, max: 400 });
    if (!fxRunning) { fxRunning = true; requestAnimationFrame(tick); }
    if (performance.now() < end) setTimeout(drop, 40);
  })();
}
function drawHeart(s) { cx.beginPath(); cx.moveTo(0, s * .3); cx.bezierCurveTo(-s, -s * .4, -s * .4, -s, 0, -s * .35); cx.bezierCurveTo(s * .4, -s, s, -s * .4, 0, s * .3); cx.fill(); }
function tick() {
  cx.clearRect(0, 0, innerWidth, innerHeight);
  parts = parts.filter(p => p.life < p.max && p.y < innerHeight + 30);
  for (const p of parts) {
    p.life++; p.vy += .18; p.vx *= .985; p.vy *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.globalAlpha = Math.min(1, (p.max - p.life) / 40); cx.fillStyle = p.c;
    if (p.shape === "rect") cx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
    else if (p.shape === "heart") drawHeart(p.s);
    else { cx.beginPath(); cx.arc(0, 0, p.s / 2.4, 0, 6.28); cx.fill(); }
    cx.restore();
  }
  if (parts.length) requestAnimationFrame(tick); else { fxRunning = false; cx.clearRect(0, 0, innerWidth, innerHeight); }
}

/* ---------- scenes ---------- */
let current = "gate";
const hooks = {};
function go(id) {
  $("#" + current).classList.remove("active");
  $("#" + id).classList.add("active");
  current = id;
  hooks[id] && hooks[id]();
}

/* ---------- music ---------- */
const bgm = $("#bgm"), musicBtn = $("#musicBtn");
if (C.music) { bgm.src = C.music; musicBtn.classList.remove("hidden"); }
function playMusic() { if (!C.music) return; bgm.play().then(() => musicBtn.classList.add("playing")).catch(() => {}); }
musicBtn.onclick = () => { if (bgm.paused) playMusic(); else { bgm.pause(); musicBtn.classList.remove("playing"); } };

/* ---------- GATE ---------- */
const fl = $("#gateFloaters");
for (let i = 0; i < 16; i++) {
  const s = document.createElement("span"); s.className = "floater";
  s.textContent = ["🥋", "💙", "✨", "⭐", "🏅"][i % 5];
  s.style.left = rand(0, 100) + "%"; s.style.fontSize = rand(16, 30) + "px";
  s.style.animationDuration = rand(9, 18) + "s"; s.style.animationDelay = -rand(0, 18) + "s";
  fl.appendChild(s);
}
const toLatinDigits = s => s.replace(/[٠-٩]/g, d => d.charCodeAt(0) - 0x660).replace(/[۰-۹]/g, d => d.charCodeAt(0) - 0x6F0);
const norm = s => toLatinDigits(String(s)).trim().toLowerCase();
const parts4 = ms => { ms = Math.max(0, ms); return [Math.floor(ms / 864e5), Math.floor(ms / 36e5) % 24, Math.floor(ms / 6e4) % 60, Math.floor(ms / 1e3) % 60]; };
function buildBoxes(el, cls) { el.innerHTML = U.units.map(u => `<div class="${cls}"><b>0</b><span>${u}</span></div>`).join(""); return [...el.querySelectorAll("b")]; }
function setBoxes(bs, vals) { vals.forEach((v, i) => bs[i].textContent = i === 0 ? v : String(v).padStart(2, "0")); }

const noPass = !C.password;
if (noPass) { $("#pwInput").classList.add("hidden"); $("#hintBtn").classList.add("hidden"); $("#gateText").classList.add("hidden"); $("#pwBtn").textContent = fill(U.gateNoPassBtn); }
if (!C.passwordHint) $("#hintBtn").classList.add("hidden");

const unlockAt = C.unlockAt ? new Date(C.unlockAt) : null;
const testMode = new URLSearchParams(location.search).has("test");
if (unlockAt && !isNaN(unlockAt) && unlockAt > new Date() && !testMode) {
  $("#passView").classList.add("hidden"); $("#countdownView").classList.remove("hidden");
  const bs = buildBoxes($("#cdGrid"), "cd-box");
  const t = setInterval(() => {
    const left = unlockAt - new Date();
    setBoxes(bs, parts4(left));
    if (left <= 0) {
      clearInterval(t);
      $("#countdownView").classList.add("hidden"); $("#passView").classList.remove("hidden");
      burst(innerWidth / 2, innerHeight / 2, 160);
    }
  }, 250);
}
$("#hintBtn").onclick = () => { $("#gateMsg").textContent = "💡 " + fill(C.passwordHint); };
$("#pwForm").onsubmit = async e => {
  e.preventDefault();
  if (noPass || norm($("#pwInput").value) === norm(C.password)) {
    playMusic();
    $("#gateMsg").textContent = "";
    $("#lockIcon").classList.add("unlocked");
    const r = $("#gateCard").getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + 40, 90, 9);
    await wait(900);
    go("intro");
  } else {
    const card = $("#gateCard"); card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
    $("#gateMsg").textContent = fill(U.wrong);
    $("#pwInput").select();
  }
};

/* ---------- INTRO ---------- */
$("#introTitle").textContent = "Congratulations!";
$("#introName").textContent = C.name;
const ib = $("#introBalloons");
for (let i = 0; i < 14; i++) {
  const f = document.createElement("span"); f.className = "floater";
  f.textContent = ["⭐", "🥋", "✨", "💙"][i % 4];
  f.style.left = rand(2, 95) + "%"; f.style.fontSize = rand(18, 34) + "px";
  f.style.animationDuration = rand(8, 15) + "s"; f.style.animationDelay = -rand(0, 14) + "s";
  ib.appendChild(f);
}
let blown = false;
async function celebrate() {
  const intro = $("#intro");
  if (blown || !intro.classList.contains("ready")) return; blown = true;
  intro.classList.add("done");
  $(".intro-hint").textContent = fill(U.afterBlow); $(".intro-hint").style.opacity = 1;
  const r = $("#cake").getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height * .3, 160, 13);
  await wait(350); burst(innerWidth * .15, innerHeight, 90, 16, .8, -Math.PI / 2 + .35);
  burst(innerWidth * .85, innerHeight, 90, 16, .8, -Math.PI / 2 - .35);
  await wait(1400); intro.classList.add("whiteout"); rain(2200);
  await wait(1900); go("main");
}
$("#cake").onclick = celebrate;
hooks.intro = async () => {
  const intro = $("#intro"); intro.classList.add("play");
  await wait(3300); intro.classList.add("ready");
};

/* ---------- MAIN ---------- */
const hb = $("#hb");
let ci = 0;
const row = (txt, cls) => `<span class="row ${cls}">` + [...txt].map(ch => `<span class="ch" style="--i:${ci++}">${ch === " " ? "&nbsp;" : ch}</span>`).join("") + "</span>";
hb.innerHTML = row("Congrats", "r1") + row("Blue Belt", "r2");
function placeHat() {}
$("#pillName").textContent = C.name;
$("#photoTag").textContent = fill(C.photoCaption);
if (!C.photoCaption) $("#photoTag").classList.add("hidden");
setImg($("#mainPhoto"), C.photo, "photo.jpg");
$$(".card-photo").forEach(img => setImg(img, C.photo, "photo.jpg"));
$("#stickyText").textContent = fill(C.note);
$("#stickyFrom").textContent = "— " + C.from;
if (!C.note) $("#envMini").classList.add("hidden");
if (!C.memories || !C.memories.length) $("#openMemBtn").classList.add("hidden");
if (!C.letters || !C.letters.length) $("#openLettersBtn").classList.add("hidden");

function makeBunting(svg, colors) {
  const p0 = [0, 8], p1 = [150, 70], p2 = [300, 4], n = 7;
  const q = (t, i) => (1 - t) ** 2 * p0[i] + 2 * (1 - t) * t * p1[i] + t * t * p2[i];
  let html = `<path d="M${p0} Q${p1} ${p2}" fill="none" stroke="#2b2340" stroke-width="2"/>`;
  for (let k = 0; k < n; k++) {
    const t = (k + .6) / (n + .4), x = q(t, 0), y = q(t, 1);
    html += `<path d="M${x - 13} ${y} L${x + 13} ${y} L${x} ${y + 34} Z" fill="${colors[k % colors.length]}" stroke="#2b2340" stroke-width="1.5" stroke-linejoin="round"/>`;
  }
  svg.innerHTML = html;
}
makeBunting($("#buntL"), ["#1f6fe0", "#9cc4f5", "#fff"]);
makeBunting($("#buntR"), ["#9cc4f5", "#1f6fe0", "#fff"]);
const sp = $("#sparkles");
[[8, 28], [44, 12], [92, 18], [6, 70], [52, 88], [90, 60], [70, 40], [30, 55]].forEach(([x, y], i) => {
  sp.insertAdjacentHTML("beforeend", `<svg class="sparkle" viewBox="0 0 24 24" style="left:${x}%;top:${y}%;animation-delay:${i * .3}s"><path d="M12 0 L14.5 9.5 L24 12 L14.5 14.5 L12 24 L9.5 14.5 L0 12 L9.5 9.5Z"/></svg>`);
});

let togetherTimer;
const since = C.togetherSince ? new Date(C.togetherSince) : null;
if (!since || isNaN(since)) $("#timerCard").classList.add("hidden");
hooks.main = () => {
  $("#main").classList.add("play");
  placeHat();
  setTimeout(() => burst(innerWidth / 2, -10, 120, 8, 1.6, Math.PI / 2), 300);
  if (since && !isNaN(since) && !togetherTimer) {
    const bs = buildBoxes($("#togetherRow"), "t-box");
    const upd = () => setBoxes(bs, parts4(new Date() - since));
    upd(); togetherTimer = setInterval(upd, 1000);
  }
};
addEventListener("resize", () => current === "main" && placeHat());

$("#envMini").onclick = e => { e.stopPropagation(); $("#sticky").classList.toggle("show"); };
$("#stickyX").onclick = () => $("#sticky").classList.remove("show");
$("#smiley").onclick = () => {
  const eye = $("#smiley .eyeR"); eye.setAttribute("ry", "1");
  setTimeout(() => eye.setAttribute("ry", "5"), 450);
};
$("#balloonMain").onclick = () => {
  const b = $("#balloonMain"), r = b.getBoundingClientRect();
  if (b.classList.contains("popped")) return;
  burst(r.left + r.width / 2, r.top + r.height / 3, 60, 9);
  b.classList.add("popped");
  setTimeout(() => { b.classList.remove("popped"); }, 2200);
};

/* ---------- MODALS ---------- */
function openModal(id) { $("#" + id).classList.add("active"); }
function closeModal(id) { $("#" + id).classList.remove("active"); if (id === "cardModal") $("#card3d").classList.remove("open"); }
$$("[data-close]").forEach(b => b.onclick = () => closeModal(b.dataset.close));
$$(".modal").forEach(m => m.addEventListener("click", e => { if (e.target === m) closeModal(m.id); }));

$("#cardDear").textContent = "Dear " + C.name;
$("#cardSub").textContent = fill(C.card.subtitle);
$("#cardMsg").textContent = fill(C.card.message);
$("#cardSig").textContent = fill(C.card.signature);
$("#cardBackText").textContent = `From ${C.from} 💙`;
$("#openCardBtn").onclick = () => openModal("cardModal");
$("#card3d").onclick = e => {
  const card = $("#card3d");
  if (!card.classList.contains("open")) {
    card.classList.add("open");
    setTimeout(() => { const r = card.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + 20, 70, 9); }, 900);
  }
};

let mi = 0;
const stage = $("#polaroidStage");
(C.memories || []).forEach((m, i) => {
  const d = document.createElement("div"); d.className = "polaroid";
  d.innerHTML = `<img alt=""><p dir="auto"></p>`;
  setImg(d.querySelector("img"), m.img, m.img || "memory", 330 + i * 25);
  d.querySelector("p").textContent = fill(m.caption);
  d.onclick = () => showMem(mi + 1);
  stage.appendChild(d);
});
const rots = [-4, 3, -2, 5, -5, 2];
function showMem(i) {
  const ps = [...stage.children], n = ps.length; if (!n) return;
  mi = (i + n) % n;
  ps.forEach((p, k) => {
    const off = (k - mi + n) % n;
    p.style.zIndex = n - off;
    p.style.opacity = off > 2 ? 0 : 1;
    p.style.transform = off === 0 ? "rotate(-2deg)" : `translate(${off * 14}px,${off * 8}px) rotate(${rots[k % 6]}deg) scale(${1 - off * .04})`;
  });
  $("#memCount").textContent = `${mi + 1} / ${n}`;
}
$("#memPrev").onclick = () => showMem(mi - 1);
$("#memNext").onclick = () => showMem(mi + 1);
$("#openMemBtn").onclick = () => { showMem(0); openModal("memModal"); };

/* ---------- LETTERS ---------- */
const hbg = $("#heartsBg");
[[-6, 30, 160], [88, 8, 120], [80, 70, 190], [-4, 82, 110]].forEach(([x, y, s], i) => {
  hbg.insertAdjacentHTML("beforeend", `<div class="big-heart" style="left:${x}%;top:${y}%;font-size:${s}px;animation-delay:${i * .5}s">♥</div>`);
});
for (let i = 0; i < 14; i++) hbg.insertAdjacentHTML("beforeend", `<div class="mini-heart" style="left:${rand(0, 100)}%;font-size:${rand(10, 20)}px;animation-duration:${rand(8, 15)}s;animation-delay:${-rand(0, 15)}s">♥</div>`);

const layer = $("#ltrLayer"), env = $("#envelope"), ctrl = $("#letterCtrl"), nextBtn = $("#nextLtr");
let ltrs = [], slots = [], reading = -1, maxShown = -1, finished = false;
function buildLetters() {
  layer.innerHTML = ""; ltrs = [];
  const n = C.letters.length;
  C.letters.forEach((t, i) => {
    const d = document.createElement("div"); d.className = "ltr";
    d.innerHTML = `<p dir="auto"></p><small></small>`;
    d.querySelector("p").textContent = fill(t);
    d.querySelector("small").textContent = C.from;
    d.style.transform = "translate(-50%,-30%) scale(.2)";
    d.onclick = () => { if (i === reading) { if (finished) scatter(i), reading = -1; return; } if (i <= maxShown) read(i); };
    layer.appendChild(d); ltrs.push(d);
    const a = (-150 + i * (360 / n) + rand(-12, 12)) * Math.PI / 180;
    slots.push({ a, r: rand(-14, 14) });
  });
}
function scatter(i) {
  const d = ltrs[i], s = slots[i];
  const small = innerWidth < 700;
  const sc = small ? .42 : .5;
  const rx = innerWidth / 2 - (small ? 70 : 130), ry = innerHeight / 2 - (small ? 90 : 110);
  const x = Math.cos(s.a) * rx, y = Math.sin(s.a) * ry;
  d.classList.remove("reading");
  d.style.zIndex = 10 + i;
  d.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(${sc}) rotate(${s.r}deg)`;
}
function read(i) {
  if (reading >= 0 && reading !== i) scatter(reading);
  const d = ltrs[i]; reading = i; maxShown = Math.max(maxShown, i);
  d.style.opacity = 1; d.classList.add("reading", "shown");
  d.style.transform = `translate(-50%, calc(-50% - ${innerWidth < 700 ? 30 : 10}px)) scale(1) rotate(0deg)`;
  updateCtrl();
}
function updateCtrl() {
  const n = ltrs.length;
  $("#ltrCount").textContent = finished ? "" : `${maxShown + 1} / ${n}`;
  nextBtn.textContent = finished ? fill(U.readAgain) : fill(maxShown >= n - 1 ? U.lastLetter : U.nextLetter);
  ctrl.classList.add("show");
}
nextBtn.onclick = () => {
  if (finished) { resetLetters(); hooks.letters(); return; }
  if (maxShown < ltrs.length - 1) read(maxShown + 1);
  else finish();
};
function finish() {
  finished = true;
  if (reading >= 0) scatter(reading); reading = -1;
  $("#finalLine").textContent = fill(C.finalLine); $("#finalLine").classList.add("show");
  rain(2600); burst(innerWidth / 2, innerHeight / 2, 140, 12);
  updateCtrl();
}
$("#seal").onclick = async () => {
  env.classList.add("open");
  await wait(1300);
  read(0);
};
function resetLetters() {
  const sc = $("#letters"); sc.classList.remove("play"); void sc.offsetWidth;
  env.classList.remove("show", "open"); ctrl.classList.remove("show");
  $("#finalLine").classList.remove("show");
  reading = -1; maxShown = -1; finished = false; slots = [];
  buildLetters();
}
hooks.letters = async () => {
  resetLetters();
  $("#letters").classList.add("play");
  await wait(4500);
  env.classList.add("show");
};
addEventListener("resize", () => { ltrs.forEach((d, i) => { if (i !== reading && i <= maxShown) scatter(i); }); });
$("#openLettersBtn").onclick = () => go("letters");
$("#lettersBack").onclick = () => go("main");
})();
</script>
</body>
</html>
